name: Prepare shared compilation on landed migration
on:
  push:
    branches: [codex/shared-compilation-rebase-20261004]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OLD_HEAD: 5e2c9ba11d01e52f1bf690ba9667c881dc91792c
      OLD_FORK: 9fd9ec0e2104106452f92c925ea7b6e4fa8df218
      LANDED_MAIN: 94ed267bac3cf7ba5b35fc11f00728f029d56a5c
      PRIOR_INTEGRATED: 018ac9921a9aff0a0f9abe923354867223731726
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rebase only the seven existing PR commits
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/evidence"
          cp .github/shared-compilation-edit.py "$RUNNER_TEMP/apply-shared.py"
          test "$(git rev-list --count "$OLD_FORK..$OLD_HEAD")" = 7
          test "$(git rev-parse origin/main)" = "$LANDED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rebase --onto "$LANDED_MAIN" "$OLD_FORK" "$OLD_HEAD"
          git fetch origin "$PRIOR_INTEGRATED"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$PRIOR_INTEGRATED^{tree}")"
          git diff --exit-code "$LANDED_MAIN" -- conformance/agent4/dependencies.lock.json build.zig.zon
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/rebased-before.commit"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/evidence/rebased-before.tree"
          git range-diff "$OLD_FORK..$OLD_HEAD" "$LANDED_MAIN..HEAD" > "$RUNNER_TEMP/evidence/rebase-range-diff.txt"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Apply the same shared-driver transformation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python "$RUNNER_TEMP/apply-shared.py"
          python - <<'PY'
          from pathlib import Path
          p = Path('build_agent4.zig')
          s = p.read_text().replace('const text_link = fixture_driver.select("agent-text-link");', 'const text_link = g.emitter("agent-text-link", g.module("test/agent4/text_link.zig"));')
          s = s.replace('text_check.addFileArg2(text_object.getEmittedBin(), .{});', 'text_object.addArgument(text_check);')
          s = s.replace('browser.addFileArg2(text_object.getEmittedBin(), .{});', 'text_object.addArgument(browser);')
          p.write_text(s)
          p = Path('test/fixture_driver.zig')
          p.write_text(p.read_text().replace('    if (std.mem.eql(u8, selected, "agent-text-link")) return @import("agent4/text_link.zig").main(init);\n', ''))
          PY
          zig fmt build_agent4.zig build.zig.zon test/fixture_driver.zig test/application_driver.zig test/authoring_tests.zig
          gh api repos/tkersey/agent/git/blobs/a565d0cd78f6f12a16916eafc08fea4448f191f1 --jq .content | base64 --decode > .github/CI.md
          test "$(git hash-object .github/CI.md)" = a565d0cd78f6f12a16916eafc08fea4448f191f1
          git add build_agent4.zig build.zig.zon repo_zig_paths.txt test/fixture_driver.zig test/application_driver.zig test/authoring_tests.zig .github/CI.md
          test "$(git diff --cached --name-only | wc -l)" = 7
          git diff --cached --check
          node test/agent4/installations.mjs --scan-only
          if ! command -v rg >/dev/null; then sudo apt-get update && sudo apt-get install --yes ripgrep; fi
          sh tools/check_zig_paths.sh
          git diff --cached > "$RUNNER_TEMP/evidence/shared-compilation.patch"
          git commit -m 'Share fixture and authoring test compilation across compatible workloads'
          git diff --exit-code "$LANDED_MAIN" -- conformance/agent4/dependencies.lock.json
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/candidate.commit"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/evidence/candidate.tree"
          git diff "$LANDED_MAIN" HEAD --stat > "$RUNNER_TEMP/evidence/pr-stat.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/evidence/candidate-source.tar.gz"
      - name: Publish objects to a temporary candidate branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            push origin HEAD:refs/heads/codex/shared-compilation-rebased-candidate-20261004
      - name: Upload exact rebase and source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-compilation-rebased
          path: ${{ runner.temp }}/evidence
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
