name: Test ablation audit snapshot
on:
  push:
    branches: [codex/test-ablation-audit-snapshot-20261004]
    paths: [.github/workflows/test-ablation-audit-snapshot.yml]
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tkersey/boundary
          ref: 6ea3f6fba0968a421f8e97b3de0de4454a4e8e2b
          path: boundary
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tkersey/world
          ref: aaf73c8c421ceabb224c8743fd853b3a095ad716
          path: world
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d21451789f3f25297ca99bcd3bbe5c1fca631905
          path: agent
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Archive tracked sources and tools without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-export"
          for repo in boundary world agent; do
            git -C "$repo" archive --format=tar.gz --prefix="$repo/" HEAD > "$RUNNER_TEMP/audit-export/$repo.tar.gz"
            git -C "$repo" rev-parse HEAD >> "$RUNNER_TEMP/audit-export/heads.txt"
          done
          zig_root="$(dirname "$(readlink -f "$(command -v zig)")")"
          tar -czf "$RUNNER_TEMP/audit-export/zig-toolchain.tar.gz" -C "$zig_root" zig lib
          tar -czf "$RUNNER_TEMP/audit-export/node-tool.tar.gz" -C "$(dirname "$(readlink -f "$(command -v node)")")" node
          cd "$RUNNER_TEMP/audit-export"
          sha256sum *.tar.gz > SHA256SUMS
      - name: Capture the already selected dependency tuple
        continue-on-error: true
        working-directory: agent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/agent4/setup.mjs --zig-exe "$(command -v zig)"
          tar -czf "$RUNNER_TEMP/audit-export/agent-inputs.tar.gz" .agent4/inputs .agent4/out/world-runtime
          cd "$RUNNER_TEMP/audit-export"
          sha256sum agent-inputs.tar.gz >> SHA256SUMS
      - name: Upload bounded audit snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-ablation-audit-snapshot
          path: ${{ runner.temp }}/audit-export/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
