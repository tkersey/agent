name: CI feedback workspace
on:
  push:
    branches: [codex/ci-feedback-workspace-20261004]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c620795210bcd874f1bb2e61d56f51abae596da
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - name: Apply exact reviewed source changes
        env:
          PATCH: 
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,os,pathlib,subprocess
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH']))
          assert hashlib.sha256(patch).hexdigest()=='b5600f93058d51d9cd974a0782da26ab2556ac1f16039804baf7096945f6798e'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          subprocess.run(['git','add','build_agent4.zig','test/agent4/installations.mjs'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='f0e8f0a049436014286eb09f5c64ac957e5a0fd3'
          PY
      - name: Verify preflight without a compiler
        run: |
          node test/agent4/installations.mjs --scan-only
          node --test test/agent4/installations.test.mjs .github/scripts/zig-cache.test.mjs
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Validate exact Zig syntax and workflow
        run: |
          zig fmt --check build_agent4.zig
          git diff --cached --check
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/zig.yml
      - name: Execute installation-only target
        run: zig build check-authoring-installation -Doptimize=safe --summary all
      - name: Publish only immutable candidate Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          api='https://api.github.com/repos/tkersey/agent/git/'
          def post(path,data):
              request=urllib.request.Request(api+path,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request) as response:return json.load(response)
          entries=[]
          for name in ['build_agent4.zig','test/agent4/installations.mjs']:
              blob=post('blobs',{'content':base64.b64encode(pathlib.Path(name).read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('trees',{'base_tree':'59ec6b66cf6e436922f71bda75d2f74838f520b1','tree':entries})
          assert tree['sha']=='f0e8f0a049436014286eb09f5c64ac957e5a0fd3'
          commit=post('commits',{'message':'Reuse installation accounting before compilation and expose focused authoring/economy targets','tree':tree['sha'],'parents':['9c620795210bcd874f1bb2e61d56f51abae596da']})
          result={'commit':commit['sha'],'tree':tree['sha'],'checks':['Node 26 preflight and cache admission','Zig 0.17 format','actionlint','installation-only build target']}
          print(json.dumps(result))
          pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-feedback-candidate
          path: ${{ runner.temp }}/candidate.json
          retention-days: 7
          if-no-files-found: error
