          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for op in ops:
              p = Path(op['path'])
              if op['old'] is None:
                  assert not p.exists(), op['path']
                  result = op['content'].encode()
              else:
                  data = p.read_bytes()
                  assert blob(data) == op['old'], op['path']
                  if op['new'] is None:
                      p.unlink()
                      continue
                  lines = data.decode().splitlines(keepends=True)
                  for start, end, text in reversed(op['edits']):
                      lines[start:end] = text.splitlines(keepends=True)
                  result = ''.join(lines).encode()
              assert blob(result) == op['new'], op['path']
              p.write_bytes(result)
