name: CI feedback workspace
on:
  push:
    branches: [codex/ci-feedback-workspace-20261004]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c620795210bcd874f1bb2e61d56f51abae596da
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - name: Apply and identify exact reviewed source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('test/agent4/installations.mjs');s=p.read_text()
          s=s.replace('new Set(["std", "boundary",','new Set(["std", "builtin", "boundary",')
          s=s.replace('function authoringFiles(sourceRoot) {','export function authoringFiles(sourceRoot = ROOT) {')
          s=s.replace('  const toolchain = selectZig([]);\n  const lock', '  // Account for source before selecting a compiler, fetching, or creating output.\n  const source = authoringFiles(sourceRoot);\n  const toolchain = selectZig([]);\n  const lock',1)
          s=s.replace('  const source = authoringFiles(sourceRoot);\n  for (const [path, bytes]', '  for (const [path, bytes]',1)
          start=s.index('    let output;\n',s.index('if (isMain(import.meta))'))
          end=s.index('\n  } catch (error)',start)
          s=s[:start]+'''    let output, sourceRoot, scanOnly = false;
              const seen = new Set();
              for (let i = 0; i < args.length; i++) {
                const flag = args[i];
                if (seen.has(flag)) throw new Error(`duplicate option: ${flag}`);
                seen.add(flag);
                if (flag === "--scan-only") { scanOnly = true; continue; }
                if (!["--output", "--source-root"].includes(flag) || !args[i + 1] || args[i + 1].startsWith("--"))
                  throw new Error("usage: installations.mjs [--scan-only] [--source-root DIR] [--output FILE]");
                const value = resolve(args[++i]);
                if (flag === "--output") output = value;
                else sourceRoot = value;
              }
              if (scanOnly) {
                const files = authoringFiles(sourceRoot);
                const result = { check: "authoring-source-accounting", result: "passed", files: [...files.keys()].sort() };
                if (output) { mkdirSync(dirname(output), { recursive: true }); writeFileSync(output, JSON.stringify(result, null, 2) + "\\n"); }
                console.log(JSON.stringify(result, null, 2));
              } else console.log(JSON.stringify(await authoringInstallation({ sourceRoot, output }), null, 2));''' + s[end:]
          p.write_text(s)
          p=Path('build_agent4.zig');s=p.read_text()
          s=s.replace('    const installation = nodeCommand(b);','''    const accounting = b.addSystemCommand(&.{ "node", "test/agent4/installations.mjs", "--scan-only" });
              accounting.has_side_effects = true;
              b.step("check-source-accounting", "Classify installed authoring imports without consumer compilation").dependOn(&accounting.step);
              const installation = nodeCommand(b);''')
          s=s.replace('    check.dependOn(&installation.step);','''    installation.step.dependOn(&accounting.step);
              const installation_check = b.step("check-authoring-installation", "Check only the external public authoring installation");
              installation_check.dependOn(&installation.step);''')
          s=s.replace('    aggregate.dependOn(&post.step);','''    b.step("check-authoring-core", "Check authoring contracts without repeating external installation").dependOn(&post.step);
              aggregate.dependOn(&post.step);
              aggregate.dependOn(installation_check);''')
          s=s.replace('    const multi_exe = g.emitter("agent4-multi", multi);','''    const multi_exe = g.emitter("agent4-multi", multi);
              const multi_images = b.step("multi-images", "Emit shared multi-shot fixtures");
              emit.dependOn(multi_images);''')
          s=s.replace('g.emit(emit, multi_exe,','g.emit(multi_images, multi_exe,')
          s=s.replace('    g.emit(emit, clarification_economy, &.{}, "clarification/scaling.json");','''    const clarification_images = b.step("clarification-images", "Emit shared clarification scaling evidence");
              g.emit(clarification_images, clarification_economy, &.{}, "clarification/scaling.json");
              emit.dependOn(clarification_images);''')
          s=s.replace('        const measure = nodeCommand(b);','''        const measure = nodeCommand(b);
                  measure.addFileArg2(b.graph.path(.install_bin, "agent4-multi"), .{ .prefix = "AGENT4_MULTI_INSPECTOR=", .make_absolute = true });''')
          s=s.replace('        measure.step.dependOn(&installed_probe.step);','''        measure.step.dependOn(&installed_probe.step);
                  measure.step.dependOn(&installed_multi.step);''')
          s=s.replace('        measure.step.dependOn(emit);','''        // Focused economy reruns need these inputs, not the entire authoring corpus.
                  measure.step.dependOn(multi_images);
                  measure.step.dependOn(clarification_images);
                  measure.step.dependOn(inquiry_app_images);''')
          p.write_text(s)
          for name,expected in [('build_agent4.zig','7a04d20ed7c55423fb76124153c9417ad8934c4f12d001db553f23d9bb9b52cd'),('test/agent4/installations.mjs','4601ca8a89ac4b77aa7cd0f42f55589b885571d187ae15163812f68aeab51eab')]:
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          subprocess.run(['git','add','build_agent4.zig','test/agent4/installations.mjs'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='f0e8f0a049436014286eb09f5c64ac957e5a0fd3'
          PY
      - name: Verify preflight without a compiler
        run: |
          node test/agent4/installations.mjs --scan-only
          node --test test/agent4/installations.test.mjs .github/scripts/zig-cache.test.mjs
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Validate exact Zig syntax and workflow
        run: |
          zig fmt --check build_agent4.zig
          git diff --cached --check
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/zig.yml
      - name: Execute installation-only target
        run: zig build check-authoring-installation -Doptimize=safe --summary all
      - name: Publish only immutable candidate Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,urllib.request
          api='https://api.github.com/repos/tkersey/agent/git/'
          def post(path,data):
              request=urllib.request.Request(api+path,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request) as response:return json.load(response)
          entries=[]
          for name in ['build_agent4.zig','test/agent4/installations.mjs']:
              blob=post('blobs',{'content':base64.b64encode(pathlib.Path(name).read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('trees',{'base_tree':'59ec6b66cf6e436922f71bda75d2f74838f520b1','tree':entries})
          assert tree['sha']=='f0e8f0a049436014286eb09f5c64ac957e5a0fd3'
          commit=post('commits',{'message':'Reuse installation accounting before compilation and expose focused authoring/economy targets','tree':tree['sha'],'parents':['9c620795210bcd874f1bb2e61d56f51abae596da']})
          result={'commit':commit['sha'],'tree':tree['sha'],'checks':['Node 26 preflight and cache admission','Zig 0.17 format','actionlint','installation-only build target']}
          print(json.dumps(result))
          pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-feedback-candidate
          path: ${{ runner.temp }}/candidate.json
          retention-days: 7
          if-no-files-found: error
