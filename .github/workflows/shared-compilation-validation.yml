name: Shared compilation validation
on:
  push:
    branches: [codex/shared-compilation-validation-20261004]
permissions:
  contents: write
  actions: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASELINE: 5e2c9ba11d01e52f1bf690ba9667c881dc91792c
      EXPECTED_TREE: 7d44754cbfaace29dae95de044e9591fd2b54e84
    steps:
      - name: Stop the superseded validation candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api repos/tkersey/agent/actions/runs/37233185425 --jq .status)
          if [ "$status" != completed ]; then
            gh api --method POST repos/tkersey/agent/actions/runs/37233185425/cancel
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve the reviewed transformation outside the subject
        run: |
          cp .github/shared-compilation-edit.py "$RUNNER_TEMP/apply-shared.py"
          git checkout --detach "$BASELINE"
          test "$(git rev-parse HEAD^{tree})" = 872e24de496d95cc8f2ab10922597b62daf0adcc
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - name: Construct and identify the exact candidate
        run: |
          set -eu
          python "$RUNNER_TEMP/apply-shared.py"
          python - <<'PY'
          from pathlib import Path
          p = Path('build_agent4.zig')
          s = p.read_text().replace('const text_link = fixture_driver.select("agent-text-link");', 'const text_link = g.emitter("agent-text-link", g.module("test/agent4/text_link.zig"));')
          s = s.replace('text_check.addFileArg2(text_object.getEmittedBin(), .{});', 'text_object.addArgument(text_check);')
          s = s.replace('browser.addFileArg2(text_object.getEmittedBin(), .{});', 'text_object.addArgument(browser);')
          p.write_text(s)
          p = Path('test/fixture_driver.zig')
          p.write_text(p.read_text().replace('    if (std.mem.eql(u8, selected, "agent-text-link")) return @import("agent4/text_link.zig").main(init);\n', ''))
          PY
          zig fmt build_agent4.zig build.zig.zon test/fixture_driver.zig test/application_driver.zig test/authoring_tests.zig
          git add build_agent4.zig build.zig.zon repo_zig_paths.txt test/fixture_driver.zig test/application_driver.zig test/authoring_tests.zig
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Share authoring fixture and test compilation without changing workloads'
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/candidate.commit"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/evidence/candidate.tree"
          git diff "$BASELINE" HEAD > "$RUNNER_TEMP/evidence/candidate.patch"
          node test/agent4/installations.mjs --scan-only
          if ! command -v rg >/dev/null; then sudo apt-get update && sudo apt-get install --yes ripgrep; fi
          sh tools/check_zig_paths.sh
      - name: Authenticate the unchanged dependency tuple
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent4/setup.mjs --zig-exe "$(command -v zig)"
      - name: Check runtime build-graph configuration before compilation
        run: |
          zig build --help -Doptimize=safe -Dboundary-source="$PWD/.agent4/inputs/boundary" \
            -Dworld-runtime="$PWD/.agent4/out/world-runtime/runtime" \
            -Dbrowser-tools="$PWD/test/agent4/browser-tools" > "$RUNNER_TEMP/evidence/build-help.txt"
      - name: Install an ephemeral emitted-file and test-discovery inspector
        run: |
          cat > "$RUNNER_TEMP/inspect.py" <<'PY'
          import hashlib, json, os, pathlib, struct, subprocess, sys
          role = sys.argv[1]
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          outputs = temp / 'outputs' / role / 'agent4'
          files = {str(p.relative_to(outputs)): {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(outputs.rglob('*')) if p.is_file()}
          assert files, 'empty emitted inventory'
          tests = {}
          for binary in sorted((temp / 'caches' / role / 'o').glob('*/test')):
              if not binary.is_file() or not os.access(binary, os.X_OK): continue
              result = subprocess.run([str(binary), '--listen=-'], input=struct.pack('<II', 4, 0) + struct.pack('<II', 0, 0), capture_output=True, timeout=15, check=True)
              remaining, names = result.stdout, None
              while remaining:
                  tag, length = struct.unpack_from('<II', remaining)
                  body, remaining = remaining[8:8+length], remaining[8+length:]
                  assert len(body) == length
                  if tag == 3:
                      string_len, count = struct.unpack_from('<II', body)
                      assert len(body) == 8 + 8*count + string_len
                      offsets = struct.unpack_from(f'<{count}I', body, 8)
                      strings = body[8+8*count:]
                      names = [strings[offset:].split(b'\0', 1)[0].decode() for offset in offsets]
              assert names is not None, str(binary)
              tests[str(binary.relative_to(temp / 'caches' / role))] = names
          assert tests, 'no test metadata discovered'
          named = sorted(name.split('.test.', 1)[1] for names in tests.values() for name in names if '.test.' in name)
          document = {'role': role, 'files': files, 'testBinaries': tests, 'namedTests': named, 'allDiscoveredTests': sum(map(len, tests.values()))}
          (temp / 'evidence' / f'{role}.json').write_text(json.dumps(document, indent=2) + '\n')
          print(json.dumps({'role': role, 'emittedFiles': len(files), 'testBinaries': len(tests), 'namedTests': len(named), 'allDiscoveredTests': document['allDiscoveredTests']}))
          PY
      - name: Cold candidate authoring with unchanged safety mode
        run: |
          set -o pipefail
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/caches/candidate"
          /usr/bin/time -f '%e' -o "$RUNNER_TEMP/evidence/candidate.seconds" \
            zig build check-authoring-core -j2 -Doptimize=safe \
            -Dboundary-source="$PWD/.agent4/inputs/boundary" \
            --cache-dir "$ZIG_GLOBAL_CACHE_DIR" --prefix "$RUNNER_TEMP/outputs/candidate" --prefix-exe-dir executables --summary all \
            2>&1 | tee "$RUNNER_TEMP/evidence/candidate.log"
          python "$RUNNER_TEMP/inspect.py" candidate
          git diff --exit-code
      - name: Cold baseline on the same runner and dependency tuple
        run: |
          set -o pipefail
          git checkout --detach "$BASELINE"
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/caches/baseline"
          /usr/bin/time -f '%e' -o "$RUNNER_TEMP/evidence/baseline.seconds" \
            zig build check-authoring-core -j2 -Doptimize=safe \
            -Dboundary-source="$PWD/.agent4/inputs/boundary" \
            --cache-dir "$ZIG_GLOBAL_CACHE_DIR" --prefix "$RUNNER_TEMP/outputs/baseline" --prefix-exe-dir executables --summary all \
            2>&1 | tee "$RUNNER_TEMP/evidence/baseline.log"
          python "$RUNNER_TEMP/inspect.py" baseline
          git diff --exit-code
      - name: Require identical emitted files and named tests
        run: |
          python - <<'PY'
          import json, os, pathlib
          area = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          before, after = [json.loads((area / f'{role}.json').read_text()) for role in ['baseline', 'candidate']]
          assert before['files'] == after['files'], 'emitted file inventory or bytes changed'
          assert before['namedTests'] == after['namedTests'], 'named test discovery changed'
          result = {'emittedFiles': len(after['files']), 'namedTests': len(after['namedTests']), 'testBinariesBefore': len(before['testBinaries']), 'testBinariesAfter': len(after['testBinaries']), 'baselineSeconds': float((area/'baseline.seconds').read_text()), 'candidateSeconds': float((area/'candidate.seconds').read_text())}
          (area / 'comparison.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Native, economy and source-free text checks on the candidate
        run: |
          set -o pipefail
          git checkout --detach "$(cat "$RUNNER_TEMP/evidence/candidate.commit")"
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/caches/candidate"
          zig build check-native check-agent4-economy check-compiled-tools -j2 -Doptimize=safe \
            -Dboundary-source="$PWD/.agent4/inputs/boundary" \
            -Dworld-runtime="$PWD/.agent4/out/world-runtime/runtime" \
            --cache-dir "$ZIG_GLOBAL_CACHE_DIR" --prefix "$RUNNER_TEMP/outputs/candidate" --prefix-exe-dir executables --summary all \
            2>&1 | tee "$RUNNER_TEMP/evidence/native-economy.log"
          git diff --exit-code
      - name: Publish validated candidate objects only to the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            push origin HEAD:refs/heads/codex/shared-compilation-candidate-20261004
      - name: Retain the bounded comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-compilation-comparison
          path: ${{ runner.temp }}/evidence
          compression-level: 6
          retention-days: 7
          if-no-files-found: warn
