name: Zig 0.17 qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Source accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - name: Check source inventory and non-destructive cache admission
        run: |
          command -v rg >/dev/null || sudo apt-get install --yes --no-install-recommends ripgrep
          sh tools/check_zig_paths.sh
          node --test .github/scripts/zig-cache.test.mjs
  qualify:
    name: Qualification / ${{ matrix.lane }} / linux-x86_64
    needs: source
    strategy:
      fail-fast: false
      matrix:
        lane: [authoring, native]
    runs-on: ${{ matrix.lane == 'native' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      ZIG_DEBUG_CMD: '1'
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.0'
          use-tool-cache: true
          use-cache: false
      - name: Restore complete compiler cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .zig-cache-upload
          key: zig-adaptive-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/agent4/dependencies.lock.json', 'conformance/agent4/native-dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-adaptive-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/agent4/dependencies.lock.json', 'conformance/agent4/native-dependencies.lock.json') }}-
      - name: Prepare compiler scratch and native isolation tools
        run: |
          if [ -d .zig-cache-upload ]; then
            test ! -e .zig-cache
            mv .zig-cache-upload .zig-cache
          fi
          mkdir -p .zig-cache/tmp
          packages=()
          command -v rg >/dev/null || packages+=(ripgrep)
          if [ "${{ matrix.lane }}" = native ]; then
            test -x /usr/bin/bwrap || packages+=(bubblewrap)
            test -x /usr/bin/strace || packages+=(strace)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            if ! sudo apt-get install --yes --no-install-recommends "${packages[@]}"; then
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends "${packages[@]}"
            fi
          fi
          if [ "${{ matrix.lane }}" = native ]; then
            /usr/bin/bwrap --unshare-user --ro-bind / / /usr/bin/true
          fi
      - name: Restore locked native transport bytes
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .agent4-native/inputs/*.tar.gz
            .agent4-native/inputs/*.zip
          key: agent-native-archives-v2-${{ matrix.lane }}-${{ hashFiles('conformance/agent4/dependencies.lock.json', 'conformance/agent4/native-dependencies.lock.json') }}
      - name: Authenticate and provision selected native inputs
        run: |
          options=()
          if [ "${{ matrix.lane }}" = authoring ]; then options+=(--authoring-only); fi
          zig run tools/native/dependencies.zig -- setup \
            conformance/agent4/dependencies.lock.json \
            conformance/agent4/native-dependencies.lock.json \
            .agent4-native/inputs "$(command -v zig)" "${options[@]}"
      - name: Run retained qualification
        run: |
          if [ "${{ matrix.lane }}" = authoring ]; then
            zig build check-agent4 -Dnative=false -Doptimize=safe --summary all
          else
            zig build check-native -Doptimize=safe --summary all \
              --prefix "$RUNNER_TEMP/agent-qualification" --prefix-exe-dir executables
            node test/agent4/installations.mjs .agent4-native/inputs \
              "$RUNNER_TEMP/agent-qualification/executables/adaptive-agent"
          fi
      - name: Package the executed adaptive application
        if: matrix.lane == 'native'
        run: |
          output="$RUNNER_TEMP/agent-qualification/executables"
          "$output/adaptive-agent" describe-build > "$output/adaptive-agent.build.json"
          cp docs/native-single-binary.md "$output/RUNBOOK.md"
          cp examples/adaptive-agent/README.md "$output/ADAPTIVE.md"
          mkdir -p "$output/adaptive-example"
          cp examples/adaptive-agent/adaptive.example.json "$output/adaptive-example/"
          cp -R examples/adaptive-agent/skills "$output/adaptive-example/skills"
          cp -R "$RUNNER_TEMP/agent-qualification/agent4/adaptive-agent" "$output/adaptive-program"
          tar -czf "$RUNNER_TEMP/adaptive-agent-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_SHA.tar.gz" \
            -C "$output" adaptive-agent adaptive-agent.build.json RUNBOOK.md ADAPTIVE.md adaptive-program adaptive-example
      - name: Retain executed adaptive application
        if: matrix.lane == 'native'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/adaptive-agent-*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Admit a complete bounded cache snapshot
        id: cache_size
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/scripts/zig-cache.mjs .zig-cache upload .zig-cache-upload
      - name: Save useful cache without deleting local outputs
        if: ${{ !cancelled() && steps.cache_size.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .zig-cache-upload
          key: zig-adaptive-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('conformance/agent4/dependencies.lock.json', 'conformance/agent4/native-dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
  native:
    name: native
    needs: [source, qualify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete qualification within the existing workflow budget
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE: ${{ needs.source.result }}
          QUALIFICATION: ${{ needs.qualify.result }}
        run: |
          test "$SOURCE" = success
          test "$QUALIFICATION" = success
          started="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .run_started_at)"
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "Complete workflow before terminal gate: ${elapsed}s (target 300s, maximum 360s)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 360
