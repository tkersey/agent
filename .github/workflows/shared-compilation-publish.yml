name: Publish shared compilation update
on:
  push:
    branches: [codex/shared-compilation-publish-20261004]
permissions:
  contents: write
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02abb019275d886e7dc06c8df8a9f4c82c4050da
          fetch-depth: 0
          persist-credentials: false
      - name: Reopen the same PR without losing the completed rebase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          old=5e2c9ba11d01e52f1bf690ba9667c881dc91792c
          final=02abb019275d886e7dc06c8df8a9f4c82c4050da
          ref=refs/heads/codex/ci-test-ablation-20261004
          test "$(git rev-parse HEAD^{tree})" = 14e7122aad9cf8a4618c40853b3ae6f5c2462015
          test "$(gh api repos/tkersey/agent/pulls/43 --jq .state)" = closed
          test "$(gh api repos/tkersey/agent/git/ref/heads/codex/zig-0.17-upgrade --jq .object.sha)" = 355672d3b39e1b9bc00315158abc749d895a72a2
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          republish() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
              push --force-with-lease="$ref:$old" origin "$final:$ref"
          }
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            push --force-with-lease="$ref:$final" origin "$old:$ref"
          trap republish EXIT
          gh api --method PATCH repos/tkersey/agent/pulls/43 -f state=open --jq '{number,state}'
          gh api --method PATCH repos/tkersey/agent/pulls/43 -f base=main --jq '{number,state,base:.base.ref}'
          republish
          trap - EXIT
          test "$(gh api repos/tkersey/agent/pulls/43 --jq .base.ref)" = main
          test "$(gh api repos/tkersey/agent/git/ref/heads/codex/ci-test-ablation-20261004 --jq .object.sha)" = "$final"
          test "$(gh api 'repos/tkersey/agent/pulls?state=open&base=codex%2Fzig-0.17-upgrade' --jq length)" = 0
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            push --force-with-lease=refs/heads/codex/zig-0.17-upgrade:355672d3b39e1b9bc00315158abc749d895a72a2 \
            origin :refs/heads/codex/zig-0.17-upgrade
